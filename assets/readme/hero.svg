<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">光影集 Video Gallery — 代码渲染的短视频作品展</title>
  <desc id="desc">深色影院风标题：光影集，副标题从国庆巡礼到 Transformer，再到艾尔登法环；右侧是一条胶片，6 格画面代表 6 部短视频。</desc>

  <defs>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b04b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e8b04b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8402f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#c8402f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="26" fill="#0b0b10"/>

  <g id="glow">
    <circle cx="180" cy="0" r="420" fill="url(#glowGold)"/>
    <circle cx="1080" cy="360" r="380" fill="url(#glowRed)"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#e8b04b">VIDEO COLLECTION · 代码渲染的短视频作品展</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#f0ead9">光影集</text>
    <text x="56" y="168" font-size="23" fill="#e8ecf4">VIDEO GALLERY — 从国庆巡礼到 Transformer</text>
    <text x="56" y="204" font-size="19" fill="#a49eb0">再到艾尔登法环的神话：逐帧渲染，AI 配图，灯箱播放。</text>
    <g id="chips" font-size="18" fill="#e8ecf4" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#16161f" stroke="#3a3644" stroke-width="1.5"/><text x="119" y="262">6 部短视频</text></g>
      <g><rect x="194" y="238" width="150" height="36" rx="18" fill="#16161f" stroke="#3a3644" stroke-width="1.5"/><text x="269" y="262">Remotion × 4</text></g>
      <g><rect x="356" y="238" width="196" height="36" rx="18" fill="#16161f" stroke="#3a3644" stroke-width="1.5"/><text x="454" y="262">Motion Canvas × 2</text></g>
      <g><rect x="564" y="238" width="140" height="36" rx="18" fill="#16161f" stroke="#3a3644" stroke-width="1.5"/><text x="634" y="262">灯箱 + 全屏</text></g>
    </g>
  </g>

  <g id="film" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="800" y="34" font-size="18" fill="#a49eb0">6 格胶片 · 6 部作品</text>
    <g id="strip">
      <rect x="800" y="48" width="344" height="272" rx="14" fill="#16161f" stroke="#26262f" stroke-width="1.5"/>
      <g fill="#0b0b10">
        <rect x="812" y="64" width="12" height="16" rx="2"/><rect x="812" y="96" width="12" height="16" rx="2"/><rect x="812" y="128" width="12" height="16" rx="2"/><rect x="812" y="160" width="12" height="16" rx="2"/><rect x="812" y="192" width="12" height="16" rx="2"/><rect x="812" y="224" width="12" height="16" rx="2"/><rect x="812" y="256" width="12" height="16" rx="2"/><rect x="812" y="288" width="12" height="16" rx="2"/>
        <rect x="1120" y="64" width="12" height="16" rx="2"/><rect x="1120" y="96" width="12" height="16" rx="2"/><rect x="1120" y="128" width="12" height="16" rx="2"/><rect x="1120" y="160" width="12" height="16" rx="2"/><rect x="1120" y="192" width="12" height="16" rx="2"/><rect x="1120" y="224" width="12" height="16" rx="2"/><rect x="1120" y="256" width="12" height="16" rx="2"/><rect x="1120" y="288" width="12" height="16" rx="2"/>
      </g>
      <g id="frames">
        <g><rect x="836" y="60" width="128" height="68" rx="6" fill="#c8402f"/><polygon points="892,84 892,104 912,94" fill="#f0ead9"/><circle cx="856" cy="80" r="4" fill="#e8b04b"/><circle cx="944" cy="112" r="4" fill="#e8b04b"/></g>
        <g><rect x="976" y="60" width="128" height="68" rx="6" fill="#a83226"/><polygon points="1032,84 1032,104 1052,94" fill="#f0ead9"/><circle cx="996" cy="80" r="4" fill="#e8b04b"/><circle cx="1084" cy="112" r="4" fill="#e8b04b"/></g>
        <g><rect x="836" y="140" width="128" height="68" rx="6" fill="#8f2f24"/><polygon points="892,164 892,184 912,174" fill="#f0ead9"/><circle cx="856" cy="160" r="4" fill="#e8b04b"/><circle cx="944" cy="192" r="4" fill="#e8b04b"/></g>
        <g><rect x="976" y="140" width="128" height="68" rx="6" fill="#5b6ee1"/><polygon points="1032,164 1032,184 1052,174" fill="#f0ead9"/><circle cx="1010" cy="158" r="3.5" fill="#f0ead9"/><circle cx="1038" cy="158" r="3.5" fill="#f0ead9"/><circle cx="1024" cy="192" r="3.5" fill="#f0ead9"/><line x1="1010" y1="158" x2="1024" y2="192" stroke="#f0ead9" stroke-width="1.5"/><line x1="1038" y1="158" x2="1024" y2="192" stroke="#f0ead9" stroke-width="1.5"/></g>
        <g><rect x="836" y="220" width="128" height="68" rx="6" fill="#2e7d6b"/><polygon points="892,244 892,264 912,254" fill="#f0ead9"/><circle cx="856" cy="240" r="4" fill="#e8b04b"/><circle cx="944" cy="272" r="4" fill="#e8b04b"/></g>
        <g><rect x="976" y="220" width="128" height="68" rx="6" fill="#6b5b2e"/><polygon points="1032,244 1032,264 1052,254" fill="#f0ead9"/><circle cx="1040" cy="254" r="14" fill="none" stroke="#e8b04b" stroke-width="2.5"/></g>
      </g>
    </g>
  </g>
</svg>
